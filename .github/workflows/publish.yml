name: Publish npm

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Exact reviewed package version; publishes with latest"
        required: true
        type: string
      verify_only:
        description: "Verify an already published version without uploading again"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  preflight:
    if: github.repository == 'realqiyan/agent-task' && github.actor == 'realqiyan' && github.triggering_actor == 'realqiyan'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
      - name: Check release ref, version and master ancestry
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: node scripts/check-release.mjs

  validate:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [preflight, validate]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate
      - uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org
      - name: Check reviewed artifact version and publication state
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
          VERIFY_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_only }}
        run: |
          node --input-type=module <<'JS'
          import { readdirSync } from "node:fs";
          import { execFileSync } from "node:child_process";
          import assert from "node:assert/strict";
          const files = readdirSync(".").filter(file => /^realqiyan-agent-task-.*\.tgz$/.test(file));
          assert.equal(files.length, 1);
          const pkg = JSON.parse(execFileSync("tar", ["-xOf", files[0], "package/package.json"], { encoding: "utf8" }));
          assert.equal(pkg.name, "@realqiyan/agent-task");
          assert.equal(pkg.version, process.env.EXPECTED_VERSION);
          assert.equal(pkg.license, "MIT");
          assert.equal(pkg.publishConfig.tag, "latest");
          if (process.env.VERIFY_ONLY !== "true") {
            const response = await fetch(`https://registry.npmjs.org/${encodeURIComponent(pkg.name)}/${encodeURIComponent(pkg.version)}`, {
              signal: AbortSignal.timeout(15000),
            });
            assert.equal(response.status, 404, "Version exists or registry state is unavailable; do not upload again");
          }
          JS
      - name: Publish with npm trusted publishing (no rebuild or package scripts)
        if: github.event_name == 'push' || !inputs.verify_only
        run: |
          npm publish realqiyan-agent-task-*.tgz --ignore-scripts --access public --tag latest --provenance --registry=https://registry.npmjs.org
      - name: Verify public latest and default global install
        env:
          EXPECTED_VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          node scripts/verify-install.mjs --registry
