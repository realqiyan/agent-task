name: Validate

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.19.0", "24.x"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: git diff --check

  package:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run pack:release
      - run: npm run pack:plugin
      - uses: actions/upload-artifact@v4
        with:
          name: npm-plugin-candidate
          path: realqiyan-agent-task-plugin-*.tgz
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: npm-candidate
          path: |
            realqiyan-agent-task-[0-9]*.tgz
            scripts/verify-install.mjs
          if-no-files-found: error
          retention-days: 7

  install:
    needs: package
    runs-on: ubuntu-latest
    steps:
      # No checkout: only the tarball and a built-in-only acceptance script.
      - uses: actions/download-artifact@v4
        with:
          name: npm-candidate
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Validate installation on this runner
        run: node scripts/verify-install.mjs realqiyan-agent-task-*.tgz
